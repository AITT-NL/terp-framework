name: prod-smoke

# Deployability gate (ADR 0062): build the PRODUCTION profile (multi-stage wheel images,
# ENVIRONMENT=production, no seed, nginx-served SPA) and prove it end-to-end — health,
# first-admin bootstrap via `terp user create` (the sanctioned production path), login
# through the same-origin nginx /api proxy, and an authenticated round-trip. This is the
# production analogue of conformance.yml's dev-workbench e2e: the prod profile cannot
# silently rot into "works only in dev".

# Path-filtered: this lane builds the production Docker images from scratch, so
# docs-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SMOKE_ADMIN_PASSWORD: Terp-Sm0ke-Cred-2026-xyz!
  SECRET_KEY: ci-prod-smoke-secret-key-0123456789abcdef
  POSTGRES_PASSWORD: ci-prod-smoke-db-password
  TERP_RUNTIME_DB_PASSWORD: ci-prod-smoke-runtime-password
  COMPOSE_FILE: apps/example/docker-compose.prod.yml:apps/example/compose.runtime-role.yml

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision the database runtime login
        run: |
          docker compose up -d --wait db
          docker compose exec -T -e TERP_RUNTIME_DB_PASSWORD db psql -X -v ON_ERROR_STOP=1 -U terp -d terp <<'SQL'
          \getenv runtime_password TERP_RUNTIME_DB_PASSWORD
          CREATE ROLE terp_rt LOGIN PASSWORD :'runtime_password';
          SQL

      - name: Build and start the production profile
        run: docker compose up -d --wait --build api web

      # `--wait` reports only "container X is unhealthy" — never why.
      - name: Why the production profile did not come up
        if: failure()
        run: docker compose logs --no-color --tail=120

      - name: Liveness + readiness through the API container
        run: |
          docker compose exec -T api \
            python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"

      # The image carries the app's record of who can reach what, and the api compared the
      # routes it serves with it before it served (ADR 0212). Held by what the api logged,
      # so a start that skipped the comparison is not a pass.
      - name: The api compared the routes it serves with its record
        run: |
          docker compose exec -T api \
            test -f /srv/authz-surface.json
          docker compose logs --no-color api \
            > "$RUNNER_TEMP/api.log" 2>&1
          grep -F "authz-surface.json matches the routes this app serves" "$RUNNER_TEMP/api.log"

      # The api probed the files capability's storage root before it served (ADR 0218): an
      # image whose user cannot write it refuses to start, and a root on the container's own
      # disk is said in the log. Held by what the api logged, as the comparison above is.
      - name: The api checked that it can write its storage root
        run: |
          docker compose -f apps/example/docker-compose.prod.yml logs --no-color api \
            > "$RUNNER_TEMP/api.log" 2>&1
          grep -E "boot checks passed: [a-z_, ]*files_storage" "$RUNNER_TEMP/api.log"
          if grep -F "not on a mounted volume" "$RUNNER_TEMP/api.log"; then
            echo "the storage root must be the files-data volume" && exit 1
          fi

      - name: Bootstrap the first administrator (terp user create)
        run: |
          docker compose run --rm \
            -e TERP_USER_PASSWORD="$SMOKE_ADMIN_PASSWORD" api \
            terp user create smoke-admin@example.test --role admin --app-root /srv

      - name: SPA is served with an SPA fallback (nginx)
        run: |
          curl -fsS http://localhost:23100/ | grep -qi '<!doctype html'
          curl -fsS http://localhost:23100/some/client/route | grep -qi '<!doctype html'

      - name: Login + authenticated round-trip through the same-origin /api proxy
        run: |
          payload=$(python3 -c 'import json,os; print(json.dumps({"email": "smoke-admin@example.test", "password": os.environ["SMOKE_ADMIN_PASSWORD"]}))')
          token=$(curl -fsS -X POST http://localhost:23100/api/v1/auth/login \
            -H 'Content-Type: application/json' -d "$payload" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:23100/api/v1/me/ -H "Authorization: Bearer $token" \
            | grep -q 'smoke-admin@example.test'

      # Stores a real file through the API and reads it back, then again from a new api
      # container: an image whose user cannot write the storage root, or a profile that keeps
      # the files in the container, turns this red. Health and login never touch the disk.
      - name: Store a file through the API and read it back from a new container
        run: |
          payload=$(python3 -c 'import json,os; print(json.dumps({"email": "smoke-admin@example.test", "password": os.environ["SMOKE_ADMIN_PASSWORD"]}))')
          token=$(curl -fsS -X POST http://localhost:23100/api/v1/auth/login \
            -H 'Content-Type: application/json' -d "$payload" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          printf 'prod-smoke stored bytes\n' > "$RUNNER_TEMP/upload.txt"
          file_id=$(curl -fsS -X POST http://localhost:23100/api/v1/files/ \
            -H "Authorization: Bearer $token" \
            -F "file=@$RUNNER_TEMP/upload.txt;type=text/plain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS "http://localhost:23100/api/v1/files/$file_id/content" \
            -H "Authorization: Bearer $token" -o "$RUNNER_TEMP/download.txt"
          cmp "$RUNNER_TEMP/upload.txt" "$RUNNER_TEMP/download.txt"
          # A new api container on the same volume still serves it. It is read from inside
          # that container, because nginx keeps the address the old one had.
          docker compose -f apps/example/docker-compose.prod.yml up -d --wait --no-deps \
            --force-recreate api
          docker compose -f apps/example/docker-compose.prod.yml exec -T \
            -e TOKEN="$token" -e FILE_ID="$file_id" api python - <<'PY'
          import os
          import urllib.request

          request = urllib.request.Request(
              f"http://localhost:8000/api/v1/files/{os.environ['FILE_ID']}/content",
              headers={"Authorization": f"Bearer {os.environ['TOKEN']}"},
          )
          with urllib.request.urlopen(request) as response:
              assert response.read() == b"prod-smoke stored bytes\n"
          PY

      - name: WebSocket upgrade + typed frame through production nginx
        run: |
          docker compose exec -T \
            -e SMOKE_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" api python - <<'PY'
          import asyncio
          import json
          import os
          import urllib.request

          import websockets

          def post(path, body, *, token=None):
              request = urllib.request.Request(
                  f"http://web:8080{path}",
                  data=json.dumps(body).encode(),
                  headers={
                      "Content-Type": "application/json",
                      **({"Authorization": f"Bearer {token}"} if token else {}),
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          login = post(
              "/api/v1/auth/login",
              {
                "email": "smoke-admin@example.test",
                "password": os.environ["SMOKE_ADMIN_PASSWORD"],
              },
          )
          ticket = post(
              "/api/v1/realtime/tickets",
              {"channel": "personal.updates", "transport": "websocket"},
              token=login["access_token"],
          )["ticket"]

          async def exercise():
              uri = (
                "ws://web:8080/api/v1/realtime/ws/personal.updates"
                f"?ticket={ticket}"
              )
              async with websockets.connect(uri) as socket:
                await socket.send(json.dumps({"action": "refresh"}))
                await socket.send(json.dumps({"wrong": True}))
                messages = {
                  json.dumps(
                    json.loads(await asyncio.wait_for(socket.recv(), timeout=10)),
                    sort_keys=True,
                  ),
                  json.dumps(
                    json.loads(await asyncio.wait_for(socket.recv(), timeout=10)),
                    sort_keys=True,
                  ),
                }
                assert messages == {
                  json.dumps(
                    {"sequence": 1, "text": "refresh accepted"},
                    sort_keys=True,
                  ),
                  json.dumps(
                    {"type": "error", "code": "invalid_message"},
                    sort_keys=True,
                  ),
                }

          asyncio.run(exercise())
          PY

      - name: Seed refuses production (fail-closed check)
        run: |
          if docker compose run --rm api terp seed; then
            echo "terp seed must refuse ENVIRONMENT=production" && exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the profile
        if: always()
        run: docker compose down -v
