name: frontend

# Frontend-contract checks: the generated TypeScript client type-checks and has not
# drifted from the committed OpenAPI contract. Complements the Python `gate` workflow,
# which keeps `openapi.json` itself in lockstep with the backend (test_openapi_contract).
# Together they form the full chain: backend -> openapi.json -> generated TS client.

# Path-filtered: docs-only changes cannot affect the frontend contract chain.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs in parallel and one that waits for them. Until they were split this was one job of
# about fifteen minutes, eleven of them the workbench's browser lanes run back to back after
# everything else, so the workflow took the sum of its parts; it now takes about as long as its
# longest job. `checks`, the name this workflow has always reported, is green only when every
# job is.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: npm audit — moderate and higher dependency CVEs
        run: npm audit --audit-level=moderate

      - name: Type-check the generated client
        run: npm run -w @terpjs/contract typecheck

      - name: Regenerate the client and fail on drift from openapi.json
        run: |
          npm run -w @terpjs/contract generate
          git diff --exit-code -- packages/frontend/contract/src/schema.d.ts

      - name: Rebuild design tokens and fail on drift from the theme sources
        run: |
          npm run -w @terpjs/contract tokens
          git diff --exit-code -- packages/frontend/contract/src/tokens.css packages/frontend/contract/src/tokens.manifest.json

      - name: Test @terpjs/contract (the route-types generator)
        run: npm run -w @terpjs/contract test

      - name: Type-check @terpjs/react-core
        run: npm run -w @terpjs/react-core typecheck

      - name: Test @terpjs/react-core
        run: npm run -w @terpjs/react-core test

      - name: Test @terpjs/eslint-boundaries (the boundary rules fire)
        run: npm run -w @terpjs/eslint-boundaries test

      # @terpjs/conformance publishes compiled JavaScript, because Playwright loads it
      # from node_modules with no bundler in front of it. Its own suite imports ../src,
      # so nothing else here would notice a broken build until an app installed it.
      - name: Build @terpjs/conformance (the published artifact)
        run: |
          npm run -w @terpjs/conformance build
          test -f packages/frontend/conformance/dist/index.js
          test -f packages/frontend/conformance/dist/index.d.ts

      # The verifiable certification artifact (scorecard.schema.json): the
      # adapter's scorecard over the violation corpus, emitted by the same
      # harness the suite above just proved green. Self-validating.
      - name: Emit the @terpjs/eslint-boundaries conformance scorecard
        run: node packages/frontend/eslint-boundaries/src/scorecard.js --out scorecard-eslint-boundaries.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-eslint-boundaries
          path: scorecard-eslint-boundaries.json

      - name: Regenerate the example client and fail on drift from openapi.json
        run: |
          npm run -w @terpjs-example/frontend generate
          git diff --exit-code -- apps/example/frontend/src/api/schema.d.ts

      # The route table is extracted from the example's module manifests and committed
      # (ADR 0092), so a manifest route added without regenerating fails here — before the
      # typecheck, where a stale table shows up as errors in the app's own screens.
      - name: Refuse a stale committed route table
        run: npm run -w @terpjs-example/frontend routes -- --check

      - name: Type-check the example frontend
        run: npm run -w @terpjs-example/frontend typecheck

      - name: Lint the example frontend (module boundary rules)
        run: npm run -w @terpjs-example/frontend lint

      - name: Build the example frontend
        run: npm run -w @terpjs-example/frontend build

      - name: Type-check the component workbench
        run: npm run -w terp-workbench typecheck

  # The component workbench is the migration's replacement gate (ADR 0094): base styles moved
  # out of `style={}` and into the injected sheet, so the unit tests no longer assert paint and
  # the rendered result is what has to be checked. It has four browser lanes, and they run as
  # separate commands — never one, because a single `playwright test` starts them in one worker
  # pool and that contention is what makes a red color-contrast result meaningless. Separate
  # runners, which is what the two jobs below are, take that contention away rather than add it.
  #
  # Every lane runs inside the Playwright image rather than on the runner. The screenshot lane
  # needs that: baselines are split by platform because font rasterisation differs by more than
  # any useful tolerance is worth, the `linux` set was recorded in
  # `mcr.microsoft.com/playwright:v1.64.1-noble`, and the runner shares Ubuntu's kernel with that
  # image but not its font packages, so comparing outside it would reduce the lane to noise on
  # its first run. The other three compare no pixels; what they gain is the browser. The image
  # carries the exact Chromium build for its tag, so no job runs `playwright install
  # --with-deps`, whose apt step usually took twenty seconds and once took eleven minutes.
  # `npm ci` runs inside the container, so `node_modules` is native to the image it runs in, and
  # `--ipc=host` gives Chromium the shared memory the container default of 64 MB does not.
  #
  # The image tag must track the Playwright version in package-lock.json, and that is gated
  # rather than remembered: `records and compares against the same browser build` in
  # specimens.spec.ts reads this file and the lockfile and refuses a mismatch in ANY tag here,
  # so the two jobs cannot drift from the lockfile or from each other. It runs inside the visual
  # job's container, so a tag it checks is a tag that just ran. Without it a mismatch presents as
  # every baseline failing at once, and the instinct that provokes is to re-record — which would
  # bury it.

  # The accessibility lane runs in full — axe over every specimen in all five themes — and is
  # what holds both contrast ratchets at empty. It is also most of this workflow's time (about
  # nine and a half of its fifteen minutes in one job), so it is split across runners with
  # Playwright's own `--shard`, which places every test of the file in exactly one shard. A
  # theme or a specimen added later is shared out with the rest; no matrix entry has to be
  # remembered for it, and none can be forgotten.
  workbench-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The shard comes from the matrix's own position and size, not from the values written
      # in it, so a fifth entry is a fifth shard and no list of numbers can skip one.
      #
      # The unsharded list comes first because `--shard` turns off Playwright's refusal of a
      # run that finds no tests: a renamed or emptied spec would leave every shard green with
      # nothing run, where the single unsharded command used to fail. The list fails on an
      # empty file, starts no server, and prints the lane's total.
      - name: Accessibility — axe over every specimen in every theme (this shard's part)
        working-directory: apps/workbench
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          listed=$(npx playwright test visual/a11y.spec.ts --list)
          echo "$listed" | tail -n 1
          npx playwright test visual/a11y.spec.ts --reporter=line --shard="$((INDEX + 1))/$TOTAL"

      - name: Keep the results when the lane failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-results-${{ strategy.job-index }}
          path: apps/workbench/test-results/
          if-no-files-found: ignore

  # The other three lanes, in one job because together they take about as long as one
  # accessibility shard.
  #
  # The keyboard lane asserts where focus goes after a keystroke, which is a behaviour rather
  # than a picture, so there is nothing platform-specific to record. It also covers the one
  # repair in this area that a unit test cannot gate, since the failure depends on the browser
  # moving focus to <body> when the focused node is removed and jsdom does not. The computed
  # lane reads values the other three cannot see at all: screenshots run with `animations:
  # "disabled"`, so every duration and easing in the sheet is invisible to them, and a `var()`
  # that fails to substitute inside a shorthand falls back to the property's initial value —
  # which paints identically at rest and kills the transition. The screenshot lane is the one
  # with a recorded baseline.
  workbench-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Keyboard — where focus goes, which no baseline and no static tree can say
        working-directory: apps/workbench
        run: npx playwright test visual/keyboard.spec.ts --reporter=line

      - name: Computed — the resolved values disabled animations and a static tree cannot show
        working-directory: apps/workbench
        run: npx playwright test visual/computed.spec.ts --reporter=line

      - name: Screenshots — every specimen against the committed linux baselines
        working-directory: apps/workbench
        run: npx playwright test visual/specimens.spec.ts --reporter=line

      # A baseline mismatch is the one failure in this workflow whose evidence is an
      # image, and until now the run discarded it: the log said which specimen moved
      # and by how many pixels, and the actual render — the only thing that answers
      # whether a real regression or a browser repaint moved it — existed for the life
      # of the container. Recording new baselines then meant reproducing the container
      # locally, which is the step the comment above explains is not casually available.
      # `tolerance` is zero, so a chromium bump lands here on purpose and this is the
      # artifact that makes it reviewable rather than a wall of red.
      - name: Keep the renders when a baseline moved
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specimen-renders
          path: apps/workbench/test-results/
          if-no-files-found: ignore

  # The check this workflow has always reported, and the one a branch rule names: green only
  # when every job above is. `always()` is what makes that true. Without it this job would be
  # skipped whenever one it needs failed or was cancelled, and GitHub reports a skipped job as
  # a success — so a red lane would leave `checks` green.
  checks:
    needs: [build-and-test, workbench-a11y, workbench-visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job above passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a job this check stands for ended '$result' (all: $RESULTS)"
              exit 1
            fi
          done
