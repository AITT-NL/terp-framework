name: frontend

# Frontend-contract checks: the generated TypeScript client type-checks and has not
# drifted from the committed OpenAPI contract. Complements the Python `gate` workflow,
# which keeps `openapi.json` itself in lockstep with the backend (test_openapi_contract).
# Together they form the full chain: backend -> openapi.json -> generated TS client.

# Path-filtered: docs-only changes cannot affect the frontend contract chain.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: npm audit — dependency CVEs (advisory, mirrors pip-audit)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Type-check the generated client
        run: npm run -w @terpjs/contract typecheck

      - name: Regenerate the client and fail on drift from openapi.json
        run: |
          npm run -w @terpjs/contract generate
          git diff --exit-code -- packages/frontend/contract/src/schema.d.ts

      - name: Rebuild design tokens and fail on drift from the theme sources
        run: |
          npm run -w @terpjs/contract tokens
          git diff --exit-code -- packages/frontend/contract/src/tokens.css packages/frontend/contract/src/tokens.manifest.json

      - name: Test @terpjs/contract (the route-types generator)
        run: npm run -w @terpjs/contract test

      - name: Type-check @terpjs/react-core
        run: npm run -w @terpjs/react-core typecheck

      - name: Test @terpjs/react-core
        run: npm run -w @terpjs/react-core test

      - name: Test @terpjs/eslint-boundaries (the boundary rules fire)
        run: npm run -w @terpjs/eslint-boundaries test

      # @terpjs/conformance publishes compiled JavaScript, because Playwright loads it
      # from node_modules with no bundler in front of it. Its own suite imports ../src,
      # so nothing else here would notice a broken build until an app installed it.
      - name: Build @terpjs/conformance (the published artifact)
        run: |
          npm run -w @terpjs/conformance build
          test -f packages/frontend/conformance/dist/index.js
          test -f packages/frontend/conformance/dist/index.d.ts

      # The verifiable certification artifact (scorecard.schema.json): the
      # adapter's scorecard over the violation corpus, emitted by the same
      # harness the suite above just proved green. Self-validating.
      - name: Emit the @terpjs/eslint-boundaries conformance scorecard
        run: node packages/frontend/eslint-boundaries/src/scorecard.js --out scorecard-eslint-boundaries.json
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-eslint-boundaries
          path: scorecard-eslint-boundaries.json

      - name: Regenerate the example client and fail on drift from openapi.json
        run: |
          npm run -w @terpjs-example/frontend generate
          git diff --exit-code -- apps/example/frontend/src/api/schema.d.ts

      # The route table is extracted from the example's module manifests and committed
      # (ADR 0092), so a manifest route added without regenerating fails here — before the
      # typecheck, where a stale table shows up as errors in the app's own screens.
      - name: Refuse a stale committed route table
        run: npm run -w @terpjs-example/frontend routes -- --check

      - name: Type-check the example frontend
        run: npm run -w @terpjs-example/frontend typecheck

      - name: Lint the example frontend (module boundary rules)
        run: npm run -w @terpjs-example/frontend lint

      - name: Build the example frontend
        run: npm run -w @terpjs-example/frontend build

      # The component workbench is the migration's replacement gate (ADR 0094): base styles
      # moved out of `style={}` and into the injected sheet, so the unit tests no longer
      # assert paint and the rendered result is what has to be checked. It ran nowhere in CI.
      #
      # The accessibility lane runs here in full — axe over every specimen in all five
      # themes, which needs no recorded baseline and is what holds both contrast ratchets at
      # empty. The screenshot lane does NOT run yet: baselines are split by platform because
      # font rasterisation differs by more than any useful tolerance, and only the win32 set
      # is recorded. Adding `visual/specimens.spec.ts` here needs a linux set recorded first,
      # which has to happen on this runner.
      - name: Type-check the component workbench
        run: npm run -w terp-workbench typecheck

      - name: Install Chromium for the workbench a11y lane
        run: npx playwright install --with-deps chromium

      - name: Accessibility — axe over every specimen in every theme
        working-directory: apps/workbench
        run: npx playwright test visual/a11y.spec.ts --reporter=line
