name: conformance

# End-to-end concept coverage: boot the Dockerized Terp stack (Postgres + seeded API + web) and
# drive real browser flows (auth gating + CRUD through the typed client) with Playwright. This is
# the behavioural complement to the frontend type/build checks and the Python architecture gate.

# Path-filtered: this lane boots the full Docker stack and runs Playwright — the most
# expensive minutes in the repo — so docs-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # @terpjs/conformance publishes compiled JavaScript (Playwright loads it from
      # node_modules, where Node refuses to strip types), so the example app's e2e specs
      # import dist/ through the workspace symlink and it has to exist first.
      - name: Build @terpjs/conformance
        run: npm run -w @terpjs/conformance build

      - name: Install Playwright (Chromium + OS deps)
        run: npx playwright install --with-deps chromium

      # Build + start the workbench and wait for it: db -> migrate -> api + web, then the one-shot
      # seed. No .env is present on a fresh checkout, so the API and web bind the default host
      # ports (22100 / 21100). `seed` stays out of `--wait`: that flag treats any container that
      # exits — even with 0 — as a failure (docker/compose#10596).
      - name: Start the workbench
        run: |
          # Build the shared backend tag BEFORE anything depends on it. Only `api`
          # declares the build (one builder, so concurrent builds of one tag cannot
          # race in the exporter), and `migrate` runs first as api's dependency — so
          # if the tag does not exist yet, compose resolves migrate's image the only
          # other way it can, by pulling, and fails with "pull access denied for
          # terp-example-backend". That is a local tag; no registry has it. Building
          # explicitly removes the ordering assumption entirely.
          docker compose -f apps/example/docker-compose.yml build api web
          docker compose -f apps/example/docker-compose.yml up -d --wait api web
          docker compose -f apps/example/docker-compose.yml run --rm seed

      # `--wait` reports only "container X is unhealthy" — never why. Without this
      # the log shows a stack that did not come up and nothing about the process
      # inside it, which is a rerun-and-guess loop rather than a diagnosis.
      - name: Why the workbench did not come up
        if: failure()
        run: docker compose -f apps/example/docker-compose.yml logs --no-color --tail=120

      - name: Run the base-profile conformance suite (app-agnostic)
        env:
          TERP_E2E_BASE_URL: http://localhost:21100
        run: npm run -w @terpjs/conformance test

      - name: Run the example app's own e2e flows (its modules)
        env:
          TERP_E2E_BASE_URL: http://localhost:21100
        run: npm run -w @terpjs-example/frontend test:e2e

      - name: Upload the Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/frontend/conformance/playwright-report/
            apps/example/frontend/playwright-report/
          retention-days: 7

      - name: Stop the workbench
        if: always()
        run: docker compose -f apps/example/docker-compose.yml down -v
