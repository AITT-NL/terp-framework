name: gate

# The enforced suite: tests + architecture rules + 100% framework line coverage.
# Runs on every push and pull request so enforcement never depends on a
# developer remembering to run it locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede stale runs: a force-push to a PR cancels the previous full run instead
# of stacking a duplicate. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      # `coverage run -m pytest`, not `pytest --cov`: coverage must start before
      # pytest loads its entry-point plugins, or the kernel imported by terp-core's
      # own pytest plugin executes untraced and its import-time lines read as missed.
      - name: Run the gate (tests + arch rules + 100% coverage)
        run: |
          uv run coverage run -m pytest
          uv run coverage report

      # The verifiable certification artifact (scorecard.schema.json): the
      # terp-arch scorecard over the violation corpus, emitted by the same
      # harness the gate just proved green. Self-validating — an invalid or
      # failing scorecard fails this step, never uploads quietly.
      - name: Emit the terp-arch conformance scorecard
        run: uv run python tools/emit_backend_scorecard.py --out scorecard-terp-arch.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-terp-arch
          path: scorecard-terp-arch.json

  # The lower bound of `requires-python = ">=3.13"`, proved instead of claimed. The
  # gate runs the suite on the newest supported interpreter; this runs the same suite
  # on the oldest, so a 3.14-only construct cannot reach PyPI under a floor that still
  # says 3.13 — the kind of break an installer discovers, not a maintainer. Coverage
  # and the scorecard stay on the gate alone: they measure the suite, not the
  # interpreter, and the scorecard is one artifact per run by name.
  lower-bound-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run the suite on the oldest supported interpreter
        run: uv run --python 3.13 pytest

  # The PostgreSQL conformance lane (ADR 0069): the migration subsystem must hold on
  # the verified production dialect, not only the SQLite dev/test engine — SQLite
  # masks real differences (VARCHAR length enforcement, timezone-aware datetimes,
  # native ALTER vs batch mode). Runs the migrations-conformance suite against a real
  # PostgreSQL service; each test creates its own scratch database.
  postgres-lane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: terp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      # The restore drill shells out to pg_dump/pg_restore, and pg_dump refuses a
      # server newer than itself. The runner image's client trails the pinned
      # `postgres:17` service above, so without this the drill SKIPS -- which is the
      # worst outcome available: a backup check that silently does not run. Installed
      # from PGDG and pinned to the same major as the service, so the two move together.
      - name: Install the matching PostgreSQL client (for the restore drill)
        run: |
          set -euxo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSfL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Installing the package is not enough, and this is the trap the assertion
          # below caught: `/usr/bin/pg_dump` is postgresql-common's `pg_wrapper`, which
          # dispatches to the DEFAULT cluster version rather than the newest installed.
          # The runner image already ships client 16, so `pg_dump --version` still says
          # 16 after `postgresql-client-17` installs cleanly. Put the versioned bin
          # directory first, so the client that runs is the one this step installed:
          # `$GITHUB_PATH` for the pytest step below, `export` for the check right here,
          # which the former does not affect.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          # Assert the major, rather than printing it. `pg_wrapper` can keep selecting
          # the runner image's older client, and the failure mode of that is a SKIPPED
          # drill -- which is green. Bumping the service image without bumping this
          # package fails here, where the cause is obvious, instead of there.
          installed="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          [ "$installed" = "17" ] || {
            echo "pg_dump is $installed; the service above is postgres:17 — the restore" \
                 "drill would skip. Bump postgresql-client-* and the service together."
            exit 1
          }

      - name: Run every test that takes terp_db_url against PostgreSQL
        env:
          TERP_TEST_POSTGRES_URL: postgresql+psycopg://postgres:terp@localhost:5432/postgres
          # A skipped backup check is green, which is the worst outcome available: the
          # green implies the drill ran. This lane installs a matching client on
          # purpose, so here a skip is a failure.
          TERP_REQUIRE_POSTGRES_LANE: "1"
        # Every module that takes the `terp_db_url` fixture runs here, because this is
        # the only job with a server: anywhere else its PostgreSQL half skips, and a skip
        # is green. The audit activity's per-day counts were claimed for both dialects
        # while only SQLite ever ran them.
        run: >-
          uv run pytest -q
          tests/architecture/test_migrations_conformance.py
          tests/architecture/test_audit_activity.py

  # Generic, tool-independent backstops layered ON TOP of the gate — they never
  # replace terp-arch. Blocking: ruff bandit (`S`) + the import-linter layer-0
  # contract (mirrors test_core_boundary). Advisory (continue-on-error): a missing
  # advisory wheel or a fresh CVE shouldn't break the gate green-ness.
  generic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: ruff — security backstop (bandit `S`), repo-wide
        run: uv run --group lint ruff check .

      - name: import-linter — terp.core layer-0 contract
        run: uv run --group lint lint-imports

      - name: pip-audit — dependency CVEs (advisory)
        continue-on-error: true
        run: uv run --group lint pip-audit

      - name: deptry — per-package dependency hygiene (advisory)
        continue-on-error: true
        run: |
          for pkg in packages/backend/core packages/backend/arch packages/backend/cli \
                     packages/backend/migrations packages/backend/capabilities/*/; do
            echo "::group::deptry $pkg"
            (cd "$pkg" && uv run --project "$GITHUB_WORKSPACE" --group lint deptry . --known-first-party terp --per-rule-ignores 'DEP003=terp|pydantic') || true
            echo "::endgroup::"
          done

      # Blocking, unlike the two advisory steps above. Each of these three was
      # measured against this repository first and each exception is a line with
      # a reason beside the code (.gitleaksignore, an inline `zizmor: ignore`),
      # so "no fix available" is a decision on file rather than a red build
      # everyone learns to scroll past. Studio ADR 0039 records the reasoning;
      # this is the same set, on the repository whose packages every generated
      # app installs.
      - name: zizmor — GitHub Actions workflow hygiene
        env:
          # Online mode adds the audits that need the API (known-vulnerable
          # actions). This repository publishes to PyPI and npm, so an action in
          # the release pipeline is a third party running code with that reach.
          GH_TOKEN: ${{ github.token }}
        run: uv run --group lint zizmor .github/workflows

      - name: gitleaks — secrets anywhere in this branch's history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # --log-opts HEAD scopes the walk to the history UNDER TEST. Without it
          # `gitleaks detect` walks every ref in the clone, and `fetch-depth: 0` above
          # fetches every remote branch -- so one unmerged branch anywhere in the
          # repository turns this step red on every OTHER open pull request, naming
          # commits their authors have never seen. That is a false positive with the
          # worst possible shape for a security control: it arrives on somebody else's
          # change, it cannot be fixed there, and the only way to make it go away is to
          # stop reading the check.
          #
          # This is not a narrowing of the control. Every branch's own history is still
          # scanned in full -- main's on every push, a pull request's on its own run,
          # and the merge ref carries the base -- so a secret still cannot reach the
          # default branch unscanned. What stops happening is one branch's fixtures
          # failing another branch's build.
          ./gitleaks detect --source . --redact --no-banner --log-opts HEAD

      - name: trivy — the Dockerfiles a generated app inherits
        # The template's four images are what every project ships, so a
        # misconfiguration here is one every client carries.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /repo/.trivyignore \
            --skip-dirs node_modules --skip-dirs .venv /repo

  # Template acceptance (ADR 0063): a generated client repo must work OUTSIDE the
  # monorepo. Render the copier template, stage local wheels for every terp
  # distribution (standing in for the published index), and run the generated
  # project's own gate against them; then build its frontend against packed npm
  # tarballs. Converts "the template deploys" from an opinion into a failing test.
  # The matrix proves each create-wizard preset (all module-less since the starter
  # module's retirement; the default render is the blank shell). The hub variant
  # additionally proves the on-demand path a real project takes: `terp new module`,
  # mount it, generate its migration, and hold the grown app to the same gate.
  template-acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default-blank
            copier-args: ""
          - variant: hub-all-capabilities
            copier-args: >-
              --data layout=hub --data use_files=true --data use_sso=true
              --data use_events=true
          - variant: process
            copier-args: "--data layout=process"
          - variant: portal
            copier-args: "--data layout=portal"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Deliberately the oldest supported interpreter, not the newest: this lane
      # builds a project the way a user's machine would, and the floor is what a
      # fresh `terp new` is allowed to assume.
      - name: Set up Python
        run: uv python install 3.13

      - name: Stage local wheels for every terp distribution
        run: |
          set -eux
          for pkg in packages/backend/core packages/backend/arch packages/backend/migrations \
                     packages/backend/cli packages/backend/capabilities/*/; do
            uv build --wheel --out-dir /tmp/terp-wheels "$pkg"
          done

      - name: Render the template (${{ matrix.variant }})
        run: |
          uvx copier copy --defaults --trust ${{ matrix.copier-args }} template /tmp/acceptance-app

      - name: Run the generated project's gate against the staged wheels
        working-directory: /tmp/acceptance-app
        env:
          UV_FIND_LINKS: /tmp/terp-wheels
        run: |
          uv sync
          uv run pytest
          # The delegated AppSec baseline must hold on rendered output (ADR 0085):
          # the in-project ratchet guards post-scaffold drift, this proves the
          # template as shipped passes its own baseline.
          uv run ruff check .
          # And its own dependency check, on every variant as rendered, before anything
          # is grown: a fresh render was red here once, over the template's own seed
          # module, and only the hub variant ran deptry, after it had been grown.
          uv run deptry .

      # The workflow a client actually runs is held to the bar this repository
      # holds itself to. It is the one artifact that reaches every consumer, so a
      # weakness here scales in the wrong direction: the more apps, the more
      # copies, each one already checked in and rarely re-read. Online mode adds
      # the audits that need the API, which is where a known-vulnerable action is
      # reported.
      - name: zizmor — the workflow every generated app inherits
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --group lint zizmor /tmp/acceptance-app/.github/workflows

      - name: Grow the app the real way — terp new module + gate (hub variant)
        if: matrix.variant == 'hub-all-capabilities'
        working-directory: /tmp/acceptance-app
        env:
          UV_FIND_LINKS: /tmp/terp-wheels
          # Autogenerating a revision diffs a live database, so it needs one that
          # outlives the command. The settings default is in-memory SQLite, which
          # would let autogenerate diff against an empty schema every time and
          # re-emit the whole model as if it were new; `terp migrate make` refuses
          # it for that reason. A file gives the acceptance run the same shape a
          # developer has.
          DATABASE_URL: sqlite:///./acceptance.db
        run: |
          set -eux
          uv run terp new module records
          # Mount it in the composition root (the gate refuses unmounted modules).
          sed -i 's/^from control_plane import control_plane$/from control_plane import control_plane\nfrom app.modules.records.module import module as records_module/' app/main.py
          sed -i 's/modules = \[login_module, me_module\]/modules = [login_module, me_module, records_module]/' app/main.py
          # Autogenerate only diffs meaningfully from head; bring the file up first.
          uv run terp migrate upgrade
          uv run terp migrate make records -m "create records table"
          # deptry, the check `terp verify --profile full` blocks on, over everything the
          # platform has now written into the project: the template's own code, a
          # scaffolded module and a generated revision.
          uv run deptry .
          uv run pytest
          # With the budget, which is the form the generated app itself uses. The bare
          # `terp check` fails closed the moment the app holds any `# arch-allow-*`
          # marker -- and since 0.23.0 widened the security rules past `app/modules/`
          # (ADR 0136), the scaffolded seed's demo password carries one. So the bare
          # form was asserting that a generated app has no governed opt-outs, which is
          # not a property the template has or wants. Naming the budget also makes this
          # step run the ratchet it was silently skipping.
          uv run terp check --budget escape-hatch-budget.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Stage packed npm tarballs for the @terp packages
        run: |
          set -eux
          npm ci
          mkdir -p /tmp/terp-npm
          for ws in @terpjs/contract @terpjs/eslint-boundaries @terpjs/react-core @terpjs/conformance; do
            npm pack -w "$ws" --pack-destination /tmp/terp-npm
          done

      - name: Build the generated frontend against the packed tarballs  # zizmor: ignore[adhoc-packages]
        working-directory: /tmp/acceptance-app/frontend
        run: |
          set -eux
          # zizmor: ignore[adhoc-packages] these tarballs are this repository's
          # own `npm pack` output from the step above — installing them is the
          # acceptance test, standing in for the registry.
          npm install /tmp/terp-npm/*.tgz
          npm install
          # The route table the template ships must be exactly what this app's own
          # generator produces (ADR 0092) — otherwise every generated app fails its own
          # CI on step one, and the committed artifact would be a lie about the manifests.
          # The hub variant scaffolded a module after render, so it first regenerates the
          # table exactly as `terp new module` instructs; --check then proves the
          # generator is idempotent and the artifact is a pure function of the manifests.
          if [ "${{ matrix.variant }}" = "hub-all-capabilities" ]; then npm run routes; fi
          npm run routes -- --check
          npm run typecheck
          npm run build

      # A generated app must be able to unit-test the one dialog it is allowed to render.
      # jsdom has no `showModal()`, ConfirmDialog calls it, and the template's
      # vitest.setup.ts is what installs the polyfill from `@terpjs/react-core/testing` --
      # so this is the only place that proves the template's setup, the package's subpath
      # export and the published tarball agree. The template ships no screen that asks for
      # a confirmation, so there is no shipped test to run instead: this drops a probe into
      # the rendered app and runs the app's own `npm test`, the command its `terp verify`
      # runs. Escape is included on purpose; it is the path a polyfill that only toggled
      # `open` got wrong.
      - name: Unit-test a ConfirmDialog flow in the generated frontend
        working-directory: /tmp/acceptance-app/frontend
        run: |
          set -eux
          cat > src/confirm-dialog.acceptance.test.tsx <<'PROBE'
          import { fireEvent, render, screen } from "@testing-library/react";
          import { useState } from "react";
          import { describe, expect, it, vi } from "vitest";

          import { Button, ConfirmDialog } from "@terpjs/react-core";

          function DeleteRecord({ onDelete }: { onDelete: () => void }) {
            const [open, setOpen] = useState(false);
            return (
              <>
                <Button onClick={() => setOpen(true)}>Delete record</Button>
                <ConfirmDialog
                  open={open}
                  onOpenChange={setOpen}
                  onConfirm={() => {
                    onDelete();
                    setOpen(false);
                  }}
                  title="Delete this record?"
                  destructive
                />
              </>
            );
          }

          function openDialog() {
            fireEvent.click(screen.getByRole("button", { name: "Delete record" }));
            return screen.getByRole("dialog", { name: "Delete this record?" });
          }

          describe("a ConfirmDialog in a generated app's unit tests", () => {
            it("confirms", () => {
              const onDelete = vi.fn();
              render(<DeleteRecord onDelete={onDelete} />);
              openDialog();
              fireEvent.click(screen.getByRole("button", { name: "Confirm" }));
              expect(onDelete).toHaveBeenCalledTimes(1);
              expect(screen.queryByRole("dialog")).not.toBeInTheDocument();
            });

            it("cancels with its button", () => {
              const onDelete = vi.fn();
              render(<DeleteRecord onDelete={onDelete} />);
              openDialog();
              fireEvent.click(screen.getByRole("button", { name: "Cancel" }));
              expect(screen.queryByRole("dialog")).not.toBeInTheDocument();
              expect(onDelete).not.toHaveBeenCalled();
            });

            it("cancels with Escape", () => {
              const onDelete = vi.fn();
              render(<DeleteRecord onDelete={onDelete} />);
              fireEvent.keyDown(openDialog(), { key: "Escape" });
              expect(screen.queryByRole("dialog")).not.toBeInTheDocument();
              expect(onDelete).not.toHaveBeenCalled();
            });
          });
          PROBE
          npm test

      # The generated workbench publishes its host ports through REQUIRED variables
      # (ADR 0134), and the generated CI's conformance job had never assigned them, so
      # `docker compose up` refused before anything ran. Nothing here started that stack,
      # so nothing noticed. `config` resolves every interpolation without starting a
      # container: the unassigned refusal proves the ports are still required, and the
      # clean resolution after `terp ports assign` proves the assignment is exactly what
      # this variant's compose file needs.
      - name: Assign the generated workbench's host ports, and prove compose accepts them
        working-directory: /tmp/acceptance-app
        env:
          UV_FIND_LINKS: /tmp/terp-wheels
        run: |
          set -eux
          # Expected to refuse, naming `terp ports assign`: nothing is assigned yet.
          if docker compose config -q; then
            echo "compose accepted a checkout with no host ports assigned; they are required" >&2
            exit 1
          fi
          uv run terp ports assign
          docker compose config -q

      # The generated app's own conformance job, end to end, on one variant. It had never
      # passed on a fresh app: besides the ports, its suite drove a port the workbench no
      # longer publishes, and its helpers looked for English names on an interface the
      # template starts in Dutch. The framework's conformance lane runs the example app
      # (English, with in-range port defaults), which is why none of it showed.
      #
      # This is the one thing an app's CI gets from the package index instead: the code
      # under test is on no index, so the staged wheels and tarballs go where the template's
      # Dockerfiles look for pre-release builds, `.terp-dist/`, and the frontend and the
      # suite are re-pointed at those copies. Their `file:` references have to resolve
      # inside the build context, and /tmp/terp-npm is outside it.
      - name: Stage the packages under test where the generated images read them (default-blank)  # zizmor: ignore[adhoc-packages]
        if: matrix.variant == 'default-blank'
        working-directory: /tmp/acceptance-app
        run: |
          set -eux
          mkdir -p .terp-dist/wheels .terp-dist/npm
          cp /tmp/terp-wheels/*.whl .terp-dist/wheels/
          cp /tmp/terp-npm/*.tgz .terp-dist/npm/
          # zizmor: ignore[adhoc-packages] this repository's own `npm pack` output, as in
          # the frontend build above, standing in for the registry.
          (cd frontend && npm install ../.terp-dist/npm/*.tgz)
          (cd conformance && npm install ../.terp-dist/npm/terpjs-conformance-*.tgz)

      # Then the job itself, read from the rendered workflow rather than restated here. A
      # restated copy is a second definition of the job: change the template's, and the
      # copy goes on proving the steps it was copied from. tools/run_workflow_job.py runs
      # the job's `run:` steps as Actions would, including its failure and cleanup steps,
      # and refuses any form it does not implement, so a template change it cannot follow
      # fails here rather than being skipped. The job's `uses:` steps are this job's own:
      # the checkout, uv and node above, and the report upload below.
      #
      # The runner starts from this repository's locked interpreter directly, not through
      # `uv run`, which would put .venv first on PATH for every step it runs: a bare `terp`
      # in the generated job would then be this checkout's, passing here and failing in the
      # app.
      - name: Run the generated app's conformance job from its own workflow (default-blank)
        if: matrix.variant == 'default-blank'
        env:
          UV_FIND_LINKS: /tmp/terp-wheels
        run: |
          set -eux
          uv sync --frozen --inexact
          .venv/bin/python tools/run_workflow_job.py \
            /tmp/acceptance-app/.github/workflows/ci.yml conformance \
            --provided actions/checkout --provided astral-sh/setup-uv \
            --provided actions/setup-node --provided actions/upload-artifact

      - name: Upload the generated app's Playwright report on failure
        if: failure() && matrix.variant == 'default-blank'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-playwright-report
          path: /tmp/acceptance-app/conformance/playwright-report/
          retention-days: 7

