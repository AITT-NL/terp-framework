name: gate

# The enforced suite: tests + architecture rules + 100% framework line coverage.
# Runs on every push and pull request so enforcement never depends on a
# developer remembering to run it locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede stale runs: a force-push to a PR cancels the previous full run instead
# of stacking a duplicate. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      # `coverage run -m pytest`, not `pytest --cov`: coverage must start before
      # pytest loads its entry-point plugins, or the kernel imported by terp-core's
      # own pytest plugin executes untraced and its import-time lines read as missed.
      - name: Run the gate (tests + arch rules + 100% coverage)
        run: |
          uv run coverage run -m pytest
          uv run coverage report

      # The verifiable certification artifact (scorecard.schema.json): the
      # terp-arch scorecard over the violation corpus, emitted by the same
      # harness the gate just proved green. Self-validating — an invalid or
      # failing scorecard fails this step, never uploads quietly.
      - name: Emit the terp-arch conformance scorecard
        run: uv run python tools/emit_backend_scorecard.py --out scorecard-terp-arch.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-terp-arch
          path: scorecard-terp-arch.json

  # The PostgreSQL conformance lane (ADR 0069): the migration subsystem must hold on
  # the verified production dialect, not only the SQLite dev/test engine — SQLite
  # masks real differences (VARCHAR length enforcement, timezone-aware datetimes,
  # native ALTER vs batch mode). Runs the migrations-conformance suite against a real
  # PostgreSQL service; each test creates its own scratch database.
  postgres-lane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: terp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Run the migrations conformance suite against PostgreSQL
        env:
          TERP_TEST_POSTGRES_URL: postgresql+psycopg://postgres:terp@localhost:5432/postgres
        run: uv run pytest tests/architecture/test_migrations_conformance.py -q

  # Generic, tool-independent backstops layered ON TOP of the gate — they never
  # replace terp-arch. Blocking: ruff bandit (`S`) + the import-linter layer-0
  # contract (mirrors test_core_boundary). Advisory (continue-on-error): a missing
  # advisory wheel or a fresh CVE shouldn't break the gate green-ness.
  generic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: ruff — security backstop (bandit `S`), repo-wide
        run: uv run --group lint ruff check .

      - name: import-linter — terp.core layer-0 contract
        run: uv run --group lint lint-imports

      - name: pip-audit — dependency CVEs (advisory)
        continue-on-error: true
        run: uv run --group lint pip-audit

      - name: deptry — per-package dependency hygiene (advisory)
        continue-on-error: true
        run: |
          for pkg in packages/backend/core packages/backend/arch packages/backend/cli \
                     packages/backend/migrations packages/backend/capabilities/*/; do
            echo "::group::deptry $pkg"
            (cd "$pkg" && uv run --project "$GITHUB_WORKSPACE" --group lint deptry . --known-first-party terp --per-rule-ignores 'DEP003=terp|pydantic') || true
            echo "::endgroup::"
          done

      # Blocking, unlike the two advisory steps above. Each of these three was
      # measured against this repository first and each exception is a line with
      # a reason beside the code (.gitleaksignore, an inline `zizmor: ignore`),
      # so "no fix available" is a decision on file rather than a red build
      # everyone learns to scroll past. Studio ADR 0039 records the reasoning;
      # this is the same set, on the repository whose packages every generated
      # app installs.
      - name: zizmor — GitHub Actions workflow hygiene
        env:
          # Online mode adds the audits that need the API (known-vulnerable
          # actions). This repository publishes to PyPI and npm, so an action in
          # the release pipeline is a third party running code with that reach.
          GH_TOKEN: ${{ github.token }}
        run: uv run --group lint zizmor .github/workflows

      - name: gitleaks — secrets anywhere in the git history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner

      - name: trivy — the Dockerfiles a generated app inherits
        # The template's four images are what every project ships, so a
        # misconfiguration here is one every client carries.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /repo/.trivyignore \
            --skip-dirs node_modules --skip-dirs .venv /repo

  # Template acceptance (ADR 0063): a generated client repo must work OUTSIDE the
  # monorepo. Render the copier template, stage local wheels for every terp
  # distribution (standing in for the published index), and run the generated
  # project's own gate against them; then build its frontend against packed npm
  # tarballs. Converts "the template deploys" from an opinion into a failing test.
  # The matrix proves each create-wizard preset (all module-less since the starter
  # module's retirement; the default render is the blank shell). The hub variant
  # additionally proves the on-demand path a real project takes: `terp new module`,
  # mount it, generate its migration, and hold the grown app to the same gate.
  template-acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default-blank
            copier-args: ""
          - variant: hub-all-capabilities
            copier-args: >-
              --data layout=hub --data use_files=true --data use_sso=true
              --data use_events=true
          - variant: process
            copier-args: "--data layout=process"
          - variant: portal
            copier-args: "--data layout=portal"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Stage local wheels for every terp distribution
        run: |
          set -eux
          for pkg in packages/backend/core packages/backend/arch packages/backend/migrations \
                     packages/backend/cli packages/backend/capabilities/*/; do
            uv build --wheel --out-dir /tmp/terp-wheels "$pkg"
          done

      - name: Render the template (${{ matrix.variant }})
        run: |
          uvx copier copy --defaults --trust ${{ matrix.copier-args }} template /tmp/acceptance-app

      - name: Run the generated project's gate against the staged wheels
        working-directory: /tmp/acceptance-app
        env:
          UV_FIND_LINKS: /tmp/terp-wheels
        run: |
          uv sync
          uv run pytest
          # The delegated AppSec baseline must hold on rendered output (ADR 0085):
          # the in-project ratchet guards post-scaffold drift, this proves the
          # template as shipped passes its own baseline.
          uv run ruff check .

      - name: Grow the app the real way — terp new module + gate (hub variant)
        if: matrix.variant == 'hub-all-capabilities'
        working-directory: /tmp/acceptance-app
        env:
          UV_FIND_LINKS: /tmp/terp-wheels
          # Autogenerating a revision diffs a live database, so it needs one that
          # outlives the command. The settings default is in-memory SQLite, which
          # would let autogenerate diff against an empty schema every time and
          # re-emit the whole model as if it were new; `terp migrate make` refuses
          # it for that reason. A file gives the acceptance run the same shape a
          # developer has.
          DATABASE_URL: sqlite:///./acceptance.db
        run: |
          set -eux
          uv run terp new module records
          # Mount it in the composition root (the gate refuses unmounted modules).
          sed -i 's/^from control_plane import control_plane$/from control_plane import control_plane\nfrom app.modules.records.module import module as records_module/' app/main.py
          sed -i 's/modules = \[login_module, me_module\]/modules = [login_module, me_module, records_module]/' app/main.py
          # Autogenerate only diffs meaningfully from head; bring the file up first.
          uv run terp migrate upgrade
          uv run terp migrate make records -m "create records table"
          uv run pytest
          uv run terp check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Stage packed npm tarballs for the @terp packages
        run: |
          set -eux
          npm ci
          mkdir -p /tmp/terp-npm
          for ws in @terpjs/contract @terpjs/eslint-boundaries @terpjs/react-core @terpjs/conformance; do
            npm pack -w "$ws" --pack-destination /tmp/terp-npm
          done

      - name: Build the generated frontend against the packed tarballs  # zizmor: ignore[adhoc-packages]
        working-directory: /tmp/acceptance-app/frontend
        run: |
          set -eux
          # zizmor: ignore[adhoc-packages] these tarballs are this repository's
          # own `npm pack` output from the step above — installing them is the
          # acceptance test, standing in for the registry.
          npm install /tmp/terp-npm/*.tgz
          npm install
          # The route table the template ships must be exactly what this app's own
          # generator produces (ADR 0092) — otherwise every generated app fails its own
          # CI on step one, and the committed artifact would be a lie about the manifests.
          # The hub variant scaffolded a module after render, so it first regenerates the
          # table exactly as `terp new module` instructs; --check then proves the
          # generator is idempotent and the artifact is a pure function of the manifests.
          if [ "${{ matrix.variant }}" = "hub-all-capabilities" ]; then npm run routes; fi
          npm run routes -- --check
          npm run typecheck
          npm run build

