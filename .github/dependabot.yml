# Keeps the dependency surfaces current, so a CVE the audits report arrives with
# its fix PR instead of only a red check. Grouped weekly: two people must not be
# buried under one PR per package.
#
# The Docker entries cover what a generated app inherits — the template's four
# images are the ones every project ships — plus the example app the suite
# builds against.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      workspace-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native port, and three things have to land before this stack can
      # take it. Its main entry exports `version` and `versionMajorMinor` and nothing else --
      # the compiler API moved behind `typescript/unstable/*`, which `contract`'s
      # routes-codegen reads (createSourceFile, ScriptTarget, forEachChild and the is* guards)
      # and which is labelled unstable by its own export map. Every published
      # typescript-eslint, canary included, declares `typescript: ">=4.8.4 <6.1.0"`, so the
      # install of @terpjs/eslint-boundaries fails outright rather than degrading -- taking
      # the boundary linter every generated project ships with it. And openapi-typescript,
      # every generated app's `generate`, builds its output with `ts.factory` from that same
      # main entry, so on 7.0.2 it stops at the first node it writes.
      #
      # Grouped bumps are all-or-nothing, so without this line one unadoptable major holds
      # five routine ones hostage every week. The signal to remove it is a typescript-eslint
      # release whose peer range admits 7 and an openapi-typescript that runs on it, not a
      # TypeScript release.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # The template's bases are a signal, never a merge. Its production Dockerfiles
  # are the render of terp-arch's base-image table (ADR 0187), held to it byte for
  # byte, so a pull request here always fails; it stays because it is the only
  # word that a patched base exists. One grouped pull request a week: read the
  # current digest of the tag the table names (`docker buildx imagetools inspect
  # <tag>`; Dependabot cannot see the tag on a FROM pinned by digest alone, and
  # has proposed another tag's image), put it and where it was read in
  # packages/backend/arch/src/terp/arch/deployment/base-images.json and
  # tables.py's BASE_IMAGE_SOURCES, render the template with
  #   TERP_WRITE_GOLDENS=1 uv run pytest tests/architecture/test_deployment_generator.py
  # and close the pull request.
  - package-ecosystem: docker
    directories:
      - /template/project
      - /template/project/frontend
    schedule:
      interval: weekly
    groups:
      template-base-images:
        patterns: ["*"]
  # The example app's Dockerfiles name tags rather than digests; grouped the same way.
  - package-ecosystem: docker
    directories:
      - /apps/example
      - /apps/example/frontend
    schedule:
      interval: weekly
    groups:
      example-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
