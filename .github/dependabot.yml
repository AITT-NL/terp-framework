# Keeps the dependency surfaces current, so a CVE the audits report arrives with
# its fix PR instead of only a red check. Grouped weekly: two people must not be
# buried under one PR per package.
#
# The Docker entries cover what a generated app inherits — the template's four
# images are the ones every project ships — plus the example app the suite
# builds against.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      workspace-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native port, and two things have to land before this stack can
      # take it. Its main entry exports `version` and `versionMajorMinor` and nothing else --
      # the compiler API moved behind `typescript/unstable/*`, which `contract`'s
      # routes-codegen reads (createSourceFile, ScriptTarget, forEachChild and the is* guards)
      # and which is labelled unstable by its own export map. And every published
      # typescript-eslint, canary included, declares `typescript: ">=4.8.4 <6.1.0"`, so the
      # install of @terpjs/eslint-boundaries fails outright rather than degrading -- taking
      # the boundary linter every generated project ships with it.
      #
      # Grouped bumps are all-or-nothing, so without this line one unadoptable major holds
      # five routine ones hostage every week. The signal to remove it is a typescript-eslint
      # release whose peer range admits 7, not a TypeScript release.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /template/project
      - /template/project/frontend
      - /apps/example
      - /apps/example/frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
