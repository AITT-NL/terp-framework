# copier.yml — Terp client-app template (design §13 Phase 5).
# Render a runnable, secure-by-default repo:  copier copy gh:AITT-NL/terp-framework/template ./my-app
_subdirectory: project
_templates_suffix: .jinja

# Files the template SEEDS but does not OWN. Copier writes them once, at `copier copy`,
# and leaves them alone on every later `copier update`.
#
# The test is whether the template's copy is a STUB that would destroy real content, not
# merely whether an app edits the file. Documentation the app also edits (`.env.example`,
# `.app.env.example`, `AGENTS.md`) stays updatable on purpose — an app that never receives
# a corrected explanation is the reason several of these seams were misunderstood.
#
# Each entry below fails that test:
#   routes.gen.d.ts       written by `terp routes` from the app's own module manifests;
#                         the template's copy is a ONE-ROUTE stub, so an update replaced a
#                         whole route table with `"/"` and turned every typed navigation
#                         into a compile error nowhere near its cause. `terp verify`
#                         regenerates and gates it; the template only makes it exist.
#   environment.schema.json  the app's own declarations; the template's is `{}`, so an
#                         update would silently un-declare every runtime variable it has.
#   escape-hatch-budget.json  the app's ratchet counts; the template's is `{}`, which
#                         would reset the ratchet to "no exceptions ever recorded".
_skip_if_exists:
  - frontend/src/routes.gen.d.ts
  - environment.schema.json
  - escape-hatch-budget.json

project_name:
  type: str
  help: Human-readable application name
  default: My Terp App

project_slug:
  type: str
  help: Distribution name (lowercase, dashes)
  default: my-terp-app

# ---------------------------------------------------------------------------
# Layout preset — the shape the app starts in. All four render a runnable,
# loginnable app with NO pre-built domain module: the first module is created
# on demand (`terp new module <name>` / the agent), named after the actual
# domain — so there is nothing generic to rename or delete. The presets
# differ only in the home page that greets a signed-in user.
#   blank — a welcome page; modules are built afterwards.
#   hub   — a HubPage landing at "/" with placeholder cards to wire up.
#   process — a work-queue landing grouped by status (placeholder cards).
#   portal  — a personal landing focused on the signed-in user (placeholder
#             cards; apply an ownership trait when modules arrive).
# ---------------------------------------------------------------------------
layout:
  type: str
  help: Starting layout
  default: blank
  choices:
    "Blank shell — sign-in and admin only; add modules later": blank
    "Hub landing — a dashboard of cards into each area": hub
    "Process — a status-based work queue for requests and cases": process
    "Portal — a personal overview for customers, staff or suppliers": portal
    # Legacy alias: projects rendered before the starter module's retirement
    # recorded `layout: list` in their answers file; `copier update` validates
    # recorded answers against these choices, so the value must stay accepted.
    # It renders identically to the blank shell (there is no starter module
    # whose list could be the landing page anymore). Never offered for new
    # projects (the Studio filters it out of the wizard).
    "(legacy) Single-list — renders the blank shell since the starter module's retirement": list

# ---------------------------------------------------------------------------
# Capability toggles — each adds the dependency AND its composition-root
# wiring, so a toggled capability works out of the box (nothing half-mounted).
# Deliberately small: capabilities that need domain decisions (webhooks,
# background jobs, multi-tenancy) are wired per-app afterwards instead.
# ---------------------------------------------------------------------------
use_files:
  type: bool
  help: File uploads (terp-cap-files) — streamed storage + admin surface
  default: false

use_sso:
  type: bool
  help: Single sign-on via OIDC (terp-cap-oidc) — enabled by OIDC_* settings
  default: false

use_events:
  type: bool
  help: Domain events (terp-cap-eventbus) — typed catalog + in-process dispatch
  default: false

use_realtime:
  type: bool
  help: Realtime channels (terp-cap-realtime) — typed SSE + WebSocket subscriptions
  default: false
