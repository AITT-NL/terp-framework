# Production nginx config for the Terp SPA (ADR 0062). Serves the built bundle with an
# SPA fallback and proxies /api to the backend service, so the browser stays same-origin.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Assets are not documents, so a CSP is moot here; nosniff is not — it stops
        # a mistyped bundle being reinterpreted as something executable.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Same-origin API: proxy to the backend. The upstream is substituted at container
    # start from ${API_UPSTREAM} (default `api:8000`, the compose service name) so the
    # same image also serves a runtime where the API is a co-located container reachable
    # on localhost — Azure Container Apps puts every container of one app in a single
    # pod, where `api` does not resolve but `127.0.0.1:8000` does. NGINX_ENVSUBST_FILTER
    # in Dockerfile.prod restricts substitution to that one name, so nginx's own $uri /
    # $host / $http_upgrade variables survive untouched.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback: every other route renders index.html (client-side router).
    location / {
        add_header Cache-Control "no-cache";
        # Security headers on the DOCUMENT (ADR 0104). Repeated per location on
        # purpose: nginx drops inherited add_header directives in any block that
        # declares its own, and both content locations set Cache-Control — so a
        # server-level copy would silently not reach the response that matters.
        # test_frontend_serves_document_security_headers gates the repetition.
        #
        # style-src needs 'unsafe-inline': @terpjs/react-core injects its token
        # stylesheet at runtime as a <style> element. Measured, not assumed —
        # without it Chromium reports style-src-elem, the document drops from two
        # live stylesheets to one, and the chrome renders unstyled.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri /index.html;
    }
}
