# Terp example — the production profile (ADR 0062).
#
#   SECRET_KEY=… POSTGRES_PASSWORD=… docker compose -f docker-compose.prod.yml up -d --wait
#
# Topology (the dev workbench's, hardened, plus the two job units it does not run):
# Postgres -> one-shot `migrate` -> the API (uvicorn, ENVIRONMENT=production, fail-fast
# config guardrails) + `web` (nginx serving the built SPA and proxying /api same-origin)
# + `worker` (drains the outbox) + `scheduler` (fires the declared schedules).
# Differences from the workbench:
#
#   - ENVIRONMENT=production: the app REFUSES to boot on a weak SECRET_KEY, DEBUG,
#     SQLite, permissive CORS, or an insecure refresh cookie (terp.core.config).
#   - Secrets come from the environment only — there is NO dev fallback; compose fails
#     fast when SECRET_KEY / POSTGRES_PASSWORD are unset.
#   - The database is the bundled `db` service by default. Set DATABASE_URL to run
#     against an external PostgreSQL instead (managed cloud, on-prem cluster) and add
#     an override that removes `db` to drop the then-unused sidecar.
#   - No `seed` service: seed data is dev/demo only (`terp seed` refuses production).
#     Bootstrap the first administrator instead with:
#       docker compose -f docker-compose.prod.yml run --rm -e TERP_USER_PASSWORD api \
#         terp user create admin@your-domain.example --role admin
#   - No --reload, no source watch: images are immutable (Dockerfile.prod).
#   - Restart policies + healthchecks on the long-running services.
#
# See docs/DEPLOYMENT.md for the full deployment guide and environment reference.
name: terp-example-prod

x-backend: &backend
  image: terp-example-backend-prod
  # App-declared environment variables (environment.schema.json): the deploy
  # pipeline renders exactly the declared keys into .app.env per environment.
  # Optional by design — plain `docker compose up` works without the file.
  env_file:
    - path: .app.env
      required: false
  environment: &backend-env
    # Unset: the bundled `db` service. Set: any external PostgreSQL — the seam an
    # external-database deployment overrides (nothing else in the profile changes).
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://terp_rt:${TERP_RUNTIME_DB_PASSWORD:?TERP_RUNTIME_DB_PASSWORD is required}@db:5432/terp}
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (>= 32 chars)}
    ENVIRONMENT: production
    BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-[]}'

# Every service logs through this. Docker's default driver on a Synology NAS
# is `db`: one SQLite database per container, with no size cap anywhere in the
# default configuration. Appending a log line to a database that has grown to
# tens of megabytes scatters small synchronous writes across the whole file,
# which is enough to saturate a spindle on its own. A flat file that rotates
# by size costs a fraction of that, and holds the same logs.
x-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # PostgreSQL 17 (17.11, Alpine), pinned by digest to the datastore table this
    # framework release publishes (terp-arch's datastore-table.json, ADR 0184): a tag
    # can move under a deployed app, and a declared `kind` unit must run exactly this.
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: terp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: terp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terp -d terp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *container-logging

  # One-shot: bring every package's schema up to head before the API serves. The API's
  # own fail-closed boot guard (PendingMigrationsError) backs this up at runtime.
  migrate:
    <<: *backend
    command: ["terp", "migrate", "upgrade", "--app-root", "/srv/app"]
    environment:
      <<: *backend-env
      DATABASE_URL: ${TERP_MIGRATION_DATABASE_URL:-${DATABASE_URL:-postgresql+psycopg://terp:${POSTGRES_PASSWORD}@db:5432/terp}}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    logging: *container-logging

  api:
    <<: *backend
    # Only the api declares the build: one builder produces the shared tag
    # (concurrent builds of one tag race in the exporter), every other backend unit
    # reuses it.
    build:
      context: ../..
      dockerfile: apps/example/Dockerfile.prod
    restart: unless-stopped
    # The files capability's storage root (/srv/var/files, which the image makes owned by
    # the user it runs as): on a named volume, so stored files outlive the container.
    volumes:
      - files-data:/srv/var/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *container-logging

  web:
    build:
      context: ../..
      dockerfile: apps/example/frontend/Dockerfile.prod
    image: terp-example-frontend-prod
    restart: unless-stopped
    ports:
      # 23100, not 8080: the same argument as the development file, one range up.
      - "${TERP_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-23100}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *container-logging

  # Drains the durable outbox until it is stopped (`terp jobs worker --forever`). It may
  # run as several replicas, so it takes no container_name.
  worker:
    <<: *backend
    command: ["terp", "jobs", "worker", "--forever"]
    init: true
    restart: unless-stopped
    # A job that writes a file writes it to the shared storage root, as the api does.
    volumes:
      - files-data:/srv/var/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The image's own HEALTHCHECK probes the api's HTTP port, which this unit does not
    # serve, so the probe is set here: healthy while the heartbeat its loop writes is
    # fresh (ADR 0191). It reads a file in the container: no HTTP, no database, no app.
    healthcheck:
      test: ["CMD", "python", "-c", "import json, os, sys, tempfile, time; beat = json.load(open(os.path.join(tempfile.gettempdir(), 'terp-' + sys.argv[1] + '.heartbeat'))); age = time.time() - beat['at']; print(json.dumps({'heartbeat': sys.argv[1], 'age_seconds': round(age, 1), 'stale_after_seconds': beat['stale_after']})); sys.exit(age > beat['stale_after'])", "worker"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *container-logging

  # Fires the declared schedules until it is stopped (`terp jobs scheduler`). Exactly one:
  # a second scheduler fires every schedule twice, so it is never scaled.
  scheduler:
    <<: *backend
    command: ["terp", "jobs", "scheduler"]
    init: true
    restart: unless-stopped
    volumes:
      - files-data:/srv/var/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The heartbeat probe, for the reason the worker's says.
    healthcheck:
      test: ["CMD", "python", "-c", "import json, os, sys, tempfile, time; beat = json.load(open(os.path.join(tempfile.gettempdir(), 'terp-' + sys.argv[1] + '.heartbeat'))); age = time.time() - beat['at']; print(json.dumps({'heartbeat': sys.argv[1], 'age_seconds': round(age, 1), 'stale_after_seconds': beat['stale_after']})); sys.exit(age > beat['stale_after'])", "scheduler"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *container-logging

volumes:
  db-data:
  files-data:
