services:
  migrate:
    command:
      - sh
      - -ec
      - |
        terp migrate upgrade --app-root /srv/app
        terp migrate grant-runtime terp_rt --app-root /srv/app
        terp migrate check-roles terp_rt --owner-role terp --app-root /srv/app
    environment:
      DB_SCHEMA_LAYOUT: per-module
  api:
    environment:
      DB_SCHEMA_LAYOUT: per-module
      DATABASE_URL: postgresql+psycopg://terp_rt:${TERP_RUNTIME_DB_PASSWORD:?supply the separately provisioned runtime password}@db:5432/terp
  worker:
    environment:
      DB_SCHEMA_LAYOUT: per-module
      DATABASE_URL: postgresql+psycopg://terp_rt:${TERP_RUNTIME_DB_PASSWORD:?supply the separately provisioned runtime password}@db:5432/terp
  scheduler:
    environment:
      DB_SCHEMA_LAYOUT: per-module
      DATABASE_URL: postgresql+psycopg://terp_rt:${TERP_RUNTIME_DB_PASSWORD:?supply the separately provisioned runtime password}@db:5432/terp
