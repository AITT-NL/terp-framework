# Terp example — the full-stack dev workbench.
#
#   cp .env.example .env         # optional: set a strong SECRET_KEY
#   docker compose watch         # build, migrate, seed, then run api + web with live sync
#
# Topology: Postgres (prod-parity DB) -> one-shot `migrate` -> one-shot `seed` -> the API
# (uvicorn) and the frontend (Vite). App and package source are bind-mounted straight from
# the checkout (uvicorn --reload + Vite HMR, both polling — reliable on every filesystem);
# dependency/manifest changes rebuild via compose watch.
name: terp-example

# Shared backend definition — migrate / seed / api run the same image. Only the `api`
# service declares the build: one builder produces the tag (concurrent builds of a shared
# tag race in the exporter: "already exists"), the one-shots reuse it.
#
# The cost of that choice: `migrate` and `seed` name a tag they cannot produce, so
# they only work once something has built it. `api` depends on `migrate`, which means
# compose resolves the one-shot's image FIRST — and with no build to fall back on it
# reaches for a registry and fails with "pull access denied for terp-example-backend".
# Whether that happens is a compose-version detail, which is exactly why nothing here
# should depend on it: build the tag explicitly before bringing the stack up
# (`docker compose build api web`, as CI does) rather than relying on the order.
x-backend: &backend
  image: terp-example-backend
  # App-declared environment variables (environment.schema.json): same seam as
  # the production profile, so a declared variable behaves identically in the
  # inner loop. Optional — the workbench runs without the file.
  env_file:
    - path: .app.env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://terp:terp@db:5432/terp
    SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-please-0123456789ab}
    ENVIRONMENT: local
  volumes:
    # The API and one-shot migrate/seed processes execute the same live checkout.
    - ./app:/workspace/app
    - ./control_plane:/workspace/control_plane
    - ../../packages/backend:/workspace/packages/backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: terp
      POSTGRES_PASSWORD: terp
      POSTGRES_DB: terp
    # Not published to the host: the API reaches it over the Compose network (db:5432), so the
    # workbench never collides with a Postgres already running on the host's 5432. Add a
    # `ports: ["5433:5432"]` here if you want to connect a database client from the host.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terp -d terp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: bring every package's schema up to head before the API serves.
  migrate:
    <<: *backend
    command: ["terp", "migrate", "upgrade", "--app-root", "/workspace/app"]
    depends_on:
      db:
        condition: service_healthy

  # One-shot: seed a usable admin (admin@acme.test) + demo content. Idempotent, dev-only.
  seed:
    <<: *backend
    command: ["terp", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    build:
      context: ../..
      dockerfile: apps/example/Dockerfile
    # --timeout-graceful-shutdown: a realtime stream ends when its client goes away and not
    # otherwise, and uvicorn waits for in-flight tasks forever by default, so one open tab
    # would hold every reload. Three seconds, because the reload loop pays it per edit.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-graceful-shutdown", "3"]
    environment:
      <<: *backend-env
      # Bind-mounted source can live on a filesystem without inotify (Docker
      # Desktop mounts) — poll instead of miss.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      # 22100, not 8000: the host side of every published port here sits in the
      # range Terp owns (web 21100+, api 22100+, deploy 23100+), away from the
      # ports a developer's other applications take. The container side stays
      # conventional -- on the Compose network it cannot collide with anything.
      - "${API_PORT:-22100}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: Dockerfile

  web:
    build:
      context: ../..
      dockerfile: apps/example/frontend/Dockerfile
    image: terp-example-frontend
    command: ["npm", "run", "-w", "@terpjs-example/frontend", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      TERP_API_PROXY: http://api:8000
      # Poll the bind-mounted source (no inotify across Desktop mounts).
      TERP_DEV_FORCE_POLLING: "true"
      # Who may embed this dev server in an iframe (frontend/vite.config.ts).
      # Empty — the default, and what a hand-run `terp docker dev` gets — means
      # `frame-ancestors 'none'`. A workbench that shows this app in a preview
      # pane exports its OWN browser origin here before starting the stack;
      # nothing inside the app can grant it, and nothing else needs to.
      TERP_DEV_FRAME_ANCESTORS: ${TERP_DEV_FRAME_ANCESTORS:-}
    ports:
      # 21100, not 5173 -- see the api service's note on the port range.
      - "${WEB_PORT:-21100}:5173"
    healthcheck:
      # Vite answers its root as soon as the port binds — which is BEFORE
      # dependency pre-bundling settles, and a request during that window can
      # still 504. This is therefore the LIVENESS question ("is a dev server
      # there?"), not a readiness one; a workbench that has to know the page
      # will actually render asks the app, which answers only once it has
      # mounted. What this buys is what compose itself needs: `up --wait` and
      # `depends_on: service_healthy` get a signal for the frontend, exactly as
      # they already have for `db` and `api`.
      #
      # Node, not wget or curl: this image is `node:24-slim`, which ships
      # neither. Using the runtime that is guaranteed present is the same
      # reasoning that has the `api` healthcheck reach for `python`.
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      # The WHOLE frontend, not just src/. `main.tsx` imports `../i18n.json`, which sits one
      # level ABOVE src/ -- so with only src/ mounted Vite resolved it to the copy baked into
      # the image at build time, and editing the locale set changed nothing in the running
      # stack, with no error anywhere. `vite.config.ts` and `tsconfig.json` were frozen the
      # same way, and the template carried the declaration too.
      #
      # Worse than invisible: the boundary lint reads the declaration from the CHECKOUT, so
      # the file a check passes on and the file the app runs on could differ while the
      # toolchain stayed green.
      #
      # The anonymous volumes masking node_modules are not optional. Without them the host's
      # directories shadow the image's, and a dependency built for the developer's own
      # platform is handed to a Linux container -- Vite then fails on a native binding with
      # an error that names neither the mount nor the cause.
      - ./frontend:/workspace/apps/example/frontend
      - /workspace/apps/example/frontend/node_modules
      - ../../packages/frontend:/workspace/packages/frontend
      - /workspace/packages/frontend/react-core/node_modules
      - /workspace/packages/frontend/contract/node_modules
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: frontend/package.json

volumes:
  db-data:
