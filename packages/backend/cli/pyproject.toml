[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-cli"
version = "0.17.0"
description = "Terp command-line tool — inspect, scaffolding, migrations, checks, api-docs."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "terp-core==0.17.0",
    # `terp migrate` delegates to terp-migrations (lazily imported), keeping Alembic
    # off the path for `terp inspect` / `terp guide` while making migrations work.
    "terp-migrations==0.17.0",
    # `terp guide rules` projects the live rule registry; terp-arch is imported lazily
    # (only when that topic is rendered), so it stays off the common `terp guide` path.
    "terp-arch==0.17.0",
    # `terp verify --only env-seams` and `terp smoke` read the compose profiles as data
    # (anchors and `<<:` merge keys resolved), so both answer without a Docker daemon or
    # even the `docker` binary. Declared explicitly rather than leant on: every app
    # already resolves PyYAML through uvicorn[standard], but that is uvicorn's choice to
    # revisit, not a dependency this CLI may inherit by luck. Imported lazily, so it
    # stays off the `terp inspect` / `terp guide` path.
    "pyyaml>=6.0",
]

# Job-process adapters stay optional: the base CLI must not install the table-owning outbox
# or a scheduler engine into apps that only use inspect/check/migrate. Deployments can select
# one process role, while `jobs` is the convenient complete jobs-process bundle.
[project.optional-dependencies]
worker = ["terp-cap-outbox==0.17.0"]
scheduler = ["terp-cap-scheduler-apscheduler==0.17.0"]
jobs = [
    "terp-cap-outbox==0.17.0",
    "terp-cap-scheduler-apscheduler==0.17.0",
]

[project.scripts]
terp = "terp.cli:main"

# PEP 420 namespace package: this distribution owns only `terp.cli`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/terp/cli"]

# Where this package comes from. The shipped changelog (`terp guide changelog`)
# ends at the installed version; the notes for a release you do not have yet
# live at these URLs, which `pip show` and the index page both surface.
[project.urls]
Repository = "https://github.com/AITT-NL/terp-framework"
Changelog = "https://github.com/AITT-NL/terp-framework/blob/main/CHANGELOG.md"
