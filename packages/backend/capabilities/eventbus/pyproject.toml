[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-cap-eventbus"
version = "0.14.0"
description = "Terp event-bus capability — the in-process dispatcher + handler registry for the core event seam."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "terp-core==0.14.0",
]

# A *library* capability: no `terp.capabilities` entry point (nothing to mount)
# and no tables. The dispatcher is installed explicitly via
# create_app(event_dispatcher=dispatch_in_process); handlers register via the
# `subscribe` decorator at import time.

# PEP 420 namespace package: this distribution owns only `terp.capabilities.eventbus`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/terp/capabilities/eventbus"]

# Where this package comes from. The shipped changelog (`terp guide changelog`)
# ends at the installed version; the notes for a release you do not have yet
# live at these URLs, which `pip show` and the index page both surface.
[project.urls]
Repository = "https://github.com/AITT-NL/terp-framework"
Changelog = "https://github.com/AITT-NL/terp-framework/blob/main/CHANGELOG.md"
