[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-cap-auth"
version = "0.15.0"
description = "Terp auth capability — Argon2 password hashing, JWT access tokens, and the get_principal seam."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "terp-core==0.15.0",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
]

# PEP 420 namespace package: this distribution owns only `terp.capabilities.auth`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/terp/capabilities/auth"]

# Where this package comes from. The shipped changelog (`terp guide changelog`)
# ends at the installed version; the notes for a release you do not have yet
# live at these URLs, which `pip show` and the index page both surface.
[project.urls]
Repository = "https://github.com/AITT-NL/terp-framework"
Changelog = "https://github.com/AITT-NL/terp-framework/blob/main/CHANGELOG.md"
