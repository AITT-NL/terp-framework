[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-core"
version = "0.5.4"
description = "Terp platform kernel — base classes, ModuleSpec, errors, pagination, DB session seam, secure-by-default config."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
]

# Config sealing (design §5.4, terp.core.secrets) loads its cipher lazily from the
# `cryptography` package; an app that never seals config never needs this extra.
[project.optional-dependencies]
secrets = ["cryptography>=48.0.1"]

# Terp ships its own pytest plugin (terp.core.testing) so every app inherits
# process-global runtime isolation without a conftest.py line. The hazard it guards
# — an order-dependent green suite — is invisible until it bites, so it is not opt-in.
# The module imports pytest lazily via this entry point; pytest is not a runtime dep.
[project.entry-points.pytest11]
terp = "terp.core.testing"

# PEP 420 namespace package: `terp` is shared across distributions, so there is
# NO src/terp/__init__.py. This distribution owns only `terp.core`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/terp/core"]

# The release notes travel WITH the platform, so `terp guide changelog` answers
# offline, in the app's own checkout. An app that cannot read what changed
# cannot judge an upgrade — and the template's pyproject already pointed at
# "the platform CHANGELOG", which until now was a dead reference to a file that
# shipped nowhere. force-include rather than a checked-in copy: one file, one
# source of truth, no mirror to drift.
[tool.hatch.build.targets.wheel.force-include]
"../../../CHANGELOG.md" = "terp/core/CHANGELOG.md"
