[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-core"
version = "0.5.10"
description = "Terp platform kernel — base classes, ModuleSpec, errors, pagination, DB session seam, secure-by-default config."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
]

# Config sealing (design §5.4, terp.core.secrets) loads its cipher lazily from the
# `cryptography` package; an app that never seals config never needs this extra.
[project.optional-dependencies]
secrets = ["cryptography>=48.0.1"]

# Terp ships its own pytest plugin (terp.core.testing) so every app inherits
# process-global runtime isolation without a conftest.py line. The hazard it guards
# — an order-dependent green suite — is invisible until it bites, so it is not opt-in.
# The module imports pytest lazily via this entry point; pytest is not a runtime dep.
[project.entry-points.pytest11]
terp = "terp.core.testing"

# PEP 420 namespace package: `terp` is shared across distributions, so there is
# NO src/terp/__init__.py. This distribution owns only `terp.core`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/terp/core"]

# The release notes travel WITH the platform (src/terp/core/CHANGELOG.md), so
# `terp guide changelog` answers offline, in the app's own checkout. An app that
# cannot read what changed cannot judge an upgrade.
#
# That copy is checked in rather than force-included from the repo root, which
# was the first attempt: a force-include reaching OUTSIDE the package directory
# cannot survive the sdist round-trip. uv builds the wheel *from the sdist*, and
# the sdist contains only this package — so hatchling resolves "../../../" against
# the unpacked sdist and dies with "Forced include not found", on PyPI's build
# path only. Nothing local sees it: no local check builds a wheel.
# The mirror this creates is held to the root by
# test_the_shipped_release_notes_match_the_repository_changelog.
