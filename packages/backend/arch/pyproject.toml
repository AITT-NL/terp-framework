[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terp-arch"
version = "0.16.0"
description = "Terp enforcement harness — secure-by-default fitness rules, shipped as a dependency clients run but cannot edit."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

# PEP 420 namespace package: this distribution owns only `terp.arch`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/terp/arch"]

# Where this package comes from. The shipped changelog (`terp guide changelog`)
# ends at the installed version; the notes for a release you do not have yet
# live at these URLs, which `pip show` and the index page both surface.
[project.urls]
Repository = "https://github.com/AITT-NL/terp-framework"
Changelog = "https://github.com/AITT-NL/terp-framework/blob/main/CHANGELOG.md"
