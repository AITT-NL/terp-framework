# The production profile this declaration describes.
name: demo-prod

services:
  db:
    image: postgres@sha256:5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    image: demo-backend-prod
    command: ["terp", "migrate", "upgrade", "--app-root", "/srv/app"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: demo-backend-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - files-data:/srv/var/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: demo-frontend-prod
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: demo-backend-prod
    command: ["terp", "jobs", "worker", "--forever"]
    restart: unless-stopped
    volumes:
      - files-data:/srv/var/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  files-data:
